name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Only needed for private repos. Needed to clone the repo.
      actions: read          # Only needed for private repos. Needed for upload-sarif to read workflow run info.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: elastic/zizmor-action@539619dc7af53d6a15669db22f7a245360156db6
        with:
          advanced-security: false
          annotations: true
          version: v1.31.1
          zizmor-config: |
            rules:
              adhoc-packages:
                disable: true
              anonymous-definition:
                disable: true
              archived-uses:
                disable: true
              artipacked:
                disable: true
              bot-conditions:
                disable: true
              cache-poisoning:
                disable: true
              concurrency-limits:
                disable: true
              dangerous-triggers:
                disable: true
              dependabot-cooldown:
                disable: true
              dependabot-execution:
                disable: true
              excessive-permissions:
                disable: true
              github-app:
                disable: true
              github-env:
                disable: true
              hardcoded-container-credentials:
                disable: true
              impostor-commit:
                disable: true
              insecure-commands:
                disable: true
              insecure-url-scheme:
                disable: true
              known-vulnerable-actions:
                disable: true
              misfeature:
                disable: true
              obfuscation:
                disable: true
              overprovisioned-secrets:
                disable: true
              ref-confusion:
                disable: true
              ref-version-mismatch:
                disable: true
              secrets-inherit:
                disable: true
              secrets-outside-env:
                disable: true
              self-hosted-runner:
                disable: true
              self-repository:
                disable: true
              stale-action-refs:
                disable: true
              superfluous-actions:
                disable: true
              template-injection:
                disable: true
              typosquat-uses:
                disable: true
              undocumented-permissions:
                disable: true
              unpinned-images:
                disable: true
              unpinned-tools:
                disable: true
              unpinned-uses:
                disable: true
              unredacted-secrets:
                disable: true
              unsound-condition:
                disable: true
              unsound-contains:
                disable: true
              unsound-ternary:
                disable: true
              use-trusted-publishing:
                disable: true
